<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>JS Mastery Quiz</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* A subtle tech-pattern background */
            background-color: #e5e7eb;
            background-image:
                linear-gradient(90deg, rgba(0, 123, 255, 0.05) 1px, transparent 1px),
                linear-gradient(rgba(7, 72, 142, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem;
            border-radius: 20px;
            border: 1px solid #d1d5db;
            /* Soft Blue Glow */
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1), 0 0 20px rgba(0, 123, 255, 0.1);
            width: 450px;
            text-align: center;
            position: relative;
        }

        .hidden {
            display: none;
        }

        h1,
        h2 {
            color: #12315d;
            margin-bottom: 1.5rem;
        }

        input {
            width: 250px;
            height: 30px;
            border-radius: 5px;
            border: 2px solid blue
        }

        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            font-weight: 600;
            color: #4b5563;
            font-size: 0.9rem;
            border-bottom: 2px solid #f3f4f6;
            padding-bottom: 10px;
        }

        #display-name {
            color: #007bff;
            /* Highlight user name in blue */
        }

        #timer {
            color: #dc3545;
            /* Timer in alert red */
        }

        #options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
        }

        button {
            padding: 12px 24px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background: #374b6b;
            color: white;
            font-weight: 600;
            transition: 0.3s;
        }

        button:hover {
            background: #0056b3;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #d1d5db;
            cursor: not-allowed;
        }

        .option-btn {
            background: #f0f0f0;
            color: #374151;
            text-align: left;
            border: 2px solid #e5e7eb;
            font-size: 1rem;
        }

        .option-btn.selected {
            background: #007bff;
            color: white;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
        }

        #q-count {
            font-weight: bold;
            color: #9ca3af;
        }

        /* Result Screen Specifics */
        .stats {
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px dashed #cbd5e1;
        }
        .stats p{
            font-weight: 700;
            color:rgb(3, 76, 3);
        }
        #thanks-msg{
            font-weight: 500;
            color: #032e6a;
        }
    </style>
</head>

<body>

    <div id="login-box" class="container">
        <h1>JS Quiz Login</h1>
        <input type="text" id="username" placeholder="Enter your name...">
        <button onclick="startQuiz()">Start Exam</button>
    </div>

    <div id="quiz-box" class="container hidden">
        <div class="header">
            <span id="display-name"></span>
            <span id="timer">Time: 00:00</span>
        </div>
        <div id="question-container">
            <h2 id="q-text">Question Text</h2>
            <div id="options"></div>
        </div>
        <div class="nav">
            <button id="prev-btn" onclick="changeQuestion(-1)">&#10094; Prev</button>
            <span id="q-count">1/20</span>
            <button id="next-btn" onclick="changeQuestion(1)">Next &#10095;</button>
        </div>
    </div>

    <div id="result-box" class="container hidden">
        <h1>Final Results</h1>
        <p id="thanks-msg"></p>
        <div class="stats">
            <p> Score : <span id="score"></span>/20</p>
            <p>Accuracy : <span id="accuracy"> </span>%</p>
        </div>
        <button onclick="location.reload()">Try Again</button>
    </div>

    <script>
        const questions = [
            { q: "What does 'DOM' stand for?", options: ["Document Object Model", "Data Object Mode", "Display Object Management"], correct: 0 },
            { q: "Which keyword is used to declare a constant?", options: ["var", "let", "const"], correct: 2 },
            { q: "Which data type is NOT primitive in JS?", options: ["String", "Object", "Boolean"], correct: 1 },
            { q: "What is the output of '2' + 2?", options: ["4", "22", "undefined"], correct: 1 },
            { q: "Which method adds an element to the end of an array?", options: ["push()", "pop()", "shift()"], correct: 0 },
            { q: "What is the result of typeof null?", options: ["null", "undefined", "object"], correct: 2 },
            { q: "Which operator is used for strict equality?", options: ["==", "===", "="], correct: 1 },
            { q: "What does the 'NaN' property represent?", options: ["Not a Number", "New and Null", "Negative and Neutral"], correct: 0 },
            { q: "How do you write a single-line comment in JS?", options: ["", "/* */", "//"], correct: 2 },
            { q: "Which function is used to parse a string into an integer?", options: ["parseInt()", "parseNumber()", "toInt()"], correct: 0 },
            { q: "What is the purpose of 'use strict'?", options: ["Enforce cleaner code", "Make JS faster", "Disable all functions"], correct: 0 },
            { q: "Which event occurs when a user clicks on an HTML element?", options: ["onmouseclick", "onclick", "onchange"], correct: 1 },
            { q: "How do you create a function in JavaScript?", options: ["function = myFunc()", "function:myFunc()", "function myFunc()"], correct: 2 },
            { q: "What is the scope of a variable declared with 'let'?", options: ["Global Scope", "Block Scope", "Function Scope Only"], correct: 1 },
            { q: "What does the 'this' keyword refer to in a method?", options: ["The global object", "The current object", "The previous function"], correct: 1 },
            { q: "Which method removes the last element from an array?", options: ["pop()", "push()", "unshift()"], correct: 0 },
            { q: "What is a closure in JavaScript?", options: ["A way to close a tab", "A function with its lexical environment", "An error handling method"], correct: 1 },
            { q: "Which of these is used to handle asynchronous operations?", options: ["Promises", "For loops", "Switch cases"], correct: 0 },
            { q: "What is the result of 5 == '5'?", options: ["true", "false", "undefined"], correct: 0 },
            { q: "Which symbol is used for template literals?", options: ["Double quotes", "Single quotes", "Backticks"], correct: 2 }
        ];

        let currentIndex = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let timer;
        let seconds = 0;
        let userName = "";

        function startQuiz() {
            userName = document.getElementById('username').value;
            if (!userName) return alert("Please enter your name!");

            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('quiz-box').classList.remove('hidden');
            document.getElementById('display-name').innerText = "Candidate: " + userName;

            startTimer();
            showQuestion();
        }

        function startTimer() {
            timer = setInterval(() => {
                seconds++;
                let mins = Math.floor(seconds / 60);
                let secs = seconds % 60;
                document.getElementById('timer').innerText = `Time: ${mins < 10 ? '0' + mins : mins}:${secs < 10 ? '0' + secs : secs}`;
            }, 1000);
        }

        function showQuestion() {
            const q = questions[currentIndex];
            document.getElementById('q-text').innerText = q.q;
            document.getElementById('q-count').innerText = `${currentIndex + 1}/${questions.length}`;

            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = "";

            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = `option-btn ${userAnswers[currentIndex] === i ? 'selected' : ''}`;
                btn.innerText = opt;
                btn.onclick = () => selectOption(i);
                optionsDiv.appendChild(btn);
            });

            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').innerText = currentIndex === questions.length - 1 ? "Finish" : "Next ❯";
        }

        function selectOption(index) {
            userAnswers[currentIndex] = index;
            showQuestion();
        }

        function changeQuestion(step) {
            if (step === 1 && currentIndex === questions.length - 1) {
                endQuiz();
                return;
            }
            currentIndex += step;
            showQuestion();
        }

        function endQuiz() {
            clearInterval(timer);
            document.getElementById('quiz-box').classList.add('hidden');
            document.getElementById('result-box').classList.remove('hidden');

            let score = 0;
            userAnswers.forEach((ans, i) => {
                if (ans === questions[i].correct) score++;
            });

            const accuracy = (score / questions.length) * 100;
            document.getElementById('thanks-msg').innerText = `Thanks for participating, ${userName}!`;
            document.getElementById('score').innerText = score;
            document.getElementById('accuracy').innerText = accuracy.toFixed(1);
        }
    </script>
</body>

</html>
