<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bird Carousel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }

        .carouals-container {
            position: relative;
            width: 80%;
            max-width: 800px;
            height: 500px;
            margin: 50px auto;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            background-color: #333; 
        }

        .slider {
            display: flex;
            height: 100%;
            transition: transform 0.5s ease-in-out;
        }

        .slide {
            min-width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-position: center;
            color: white;
            position: relative;
        }

        .slide::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        .slide h1,
        .slide button {
            position: relative;
            z-index: 2;
        }

        .btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.8);
            border: none;
            padding: 15px;
            cursor: pointer;
            border-radius: 50%;
            z-index: 10; 
            font-weight: bold;
        }

        .prev { left: 10px; }
        .next { right: 10px; }
    </style>
</head>

<body>
    <div class="carouals-container">
        <div class="slider" id="img-sliders"></div>

        <button class="btn prev" onclick="changeSlide(-1)">❮</button>
        <button class="btn next" onclick="changeSlide(1)">❯</button>
    </div>

    <script>
        const images = [
            { img: 'https://images.pexels.com/photos/1123767/pexels-photo-1123767.jpeg', tittle: 'Perched Toco Toucan Bird' },
            { img: 'https://images.pexels.com/photos/135940/pexels-photo-135940.jpeg', tittle: 'Rose-ring Parakeet' },
            { img: 'https://images.unsplash.com/photo-1518992028580-6d57bd80f2dd?q=80&w=415&auto=format&fit=crop', tittle: 'Blue-tailed Bee Eater' },
            { img: 'https://images.unsplash.com/photo-1572877183903-f6f33bbfa7c5?w=600&auto=format&fit=crop', tittle: 'Peacock' },
            { img: 'https://images.unsplash.com/photo-1500350347612-85b7eff2f759?w=600&auto=format&fit=crop', tittle: 'Butterfly' }
        ];

        const imageslider = document.getElementById('img-sliders');
        let index = 0;

        images.forEach(item => {
            const slide = document.createElement('div');
            slide.className = 'slide';
            slide.style.backgroundImage = `url('${item.img}')`;
            slide.innerHTML = `
                <h1>${item.tittle}</h1>
                <button style="margin-top:10px; padding:8px 16px; cursor:pointer;">View More</button>
            `;
            imageslider.appendChild(slide);
        });

        function changeSlide(direction) {
            const totalSlides = images.length;
            index = (index + direction + totalSlides) % totalSlides;
            
            imageslider.style.transform = `translateX(-${index * 100}%)`;
        }
    </script>
</body>

</html>
